[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = []

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[invariant]
runs = 32
depth = 50
fail_on_revert = true
